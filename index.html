<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./index.js" defer></script>
    <script
      src="https://kit.fontawesome.com/d35c50d71f.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img
            class="logo"
            src="./assets/favpng_a62cf9447b69a161bf1a5f367d40aad6.png"
            alt=""
          />
        </figure>
        <figure>
          <img
            src="./assets/undraw_movie-night_pkvp (1).svg"
            class="landing__img"
          />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a href="#" class="nav__link--anchor link__hover-effect">Home</a>
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor nav__link-anchor--black link__hover-effect link__hover-effect--black"
              >Find YOUR Movie</a
            >
          </li>
          <li class="nav__link">
            <a href="#" class="nav__link--anchor nav__link--primary"
              >NEW RELEASES!</a
            >
          </li>
        </ul>

        <button class="btn__menu" onclick="openMenu()">
          <i class="fas fa-bars"></i>
        </button>
        <div class="menu__backdrop">
          <button class="btn__menu btn__menu--close" onclick="closeMenu()">
            <i class="fas fa-times"></i>
            <ul class="menu__links">
              <li class="menu__list">
                <a href="#" class="menu__link">Home</a>
              </li>
              <li class="menu__list">
                <a href="#movies" class="menu__link">Find YOUR Movie</a>
              </li>
              <li class="menu__list">
                <a href="#" class="menu__link menu__link--primary"
                  >NEW RELEASES!</a
                >
              </li>
            </ul>
          </button>
        </div>
      </nav>

      <div class="landing__container">
        <h1 class="landing__title">
          America's most used movie streaming platform!
        </h1>
        <h2 class="landing__decscription">
          Stream your favorite movies with <span class="purple">movies!</span>
        </h2>
 
      </div>
      <div class="input-wrapper">
        <input
          type="text"
          placeholder="Search by Year, or Movie Title"
          class="input__wrapper--text"
          onchange="searchChange(event)"
        />
        <button class="btn">
          <a href="#">
            <i class="fa-solid fa-magnifying-glass"></i>
          </a>
        </button>
      </div>
   
 </section>

    <section id="movies">
  
      <div class="container">
        <div class="row">
          <span class="search-result">Searh Result:</span>
          <span class="searchName"></span>

          <div class="movie-list">
            <div class="movie">
              <div class="movie-card__container">
                <div class="movie-card">
                  <img src="" alt="" />
                  <h2></h2>
                  <h4></h4>
                  <p></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
